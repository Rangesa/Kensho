# x86-64 Semantic Rules (Phase 1)
# iced-x86でデコード、TOMLでセマンティクス定義

[metadata]
architecture = "x86-64"
version = "1.0.0"

# ========================================
# 命令クラス定義（共通セマンティクス）
# ========================================

[instruction_classes.binary_arithmetic]
description = "Two-operand arithmetic operations"
instructions = ["ADD", "SUB", "ADC", "SBB"]

[instruction_classes.binary_arithmetic.pattern]
operands = ["dest:reg_or_mem", "src:reg_or_mem_or_imm"]

[instruction_classes.binary_arithmetic.semantics]
# $0 = destination, $1 = source, {op} = operator
pcode = """
temp = $0 {op} $1
$0 = temp
ZF = (temp == 0)
SF = (temp s< 0)
CF = carry($0, $1)
OF = overflow($0, $1)
"""

[instruction_classes.binary_logic]
description = "Two-operand logical operations"
instructions = ["AND", "OR", "XOR"]

[instruction_classes.binary_logic.pattern]
operands = ["dest:reg_or_mem", "src:reg_or_mem_or_imm"]

[instruction_classes.binary_logic.semantics]
pcode = """
$0 = $0 {op} $1
ZF = ($0 == 0)
SF = ($0 s< 0)
CF = 0
OF = 0
"""

# ========================================
# 個別命令定義
# ========================================

# --- データ移動 ---

[instructions.MOV]
description = "Move data"
pcode = "$0 = $1"

[instructions.MOVZX]
description = "Move with zero extend"
pcode = "$0 = zext($1)"

[instructions.MOVSX]
description = "Move with sign extend"
pcode = "$0 = sext($1)"

[instructions.LEA]
description = "Load effective address"
pcode = "$0 = addr($1)"

[instructions.XCHG]
description = "Exchange"
pcode = """
temp = $0
$0 = $1
$1 = temp
"""

# --- スタック操作 ---

[instructions.PUSH]
description = "Push to stack"
pcode = "PUSH $0"

[instructions.POP]
description = "Pop from stack"
pcode = "POP $0"

[instructions.LEAVE]
description = "Leave stack frame"
pcode = """
RSP = RBP
RBP = *RSP
RSP = RSP + 8
"""

# --- 算術演算 ---

[instructions.ADD]
class = "binary_arithmetic"
operator = "INT_ADD"

[instructions.SUB]
class = "binary_arithmetic"
operator = "INT_SUB"

[instructions.INC]
description = "Increment"
pcode = """
$0 = $0 + 1
ZF = ($0 == 0)
SF = ($0 s< 0)
"""

[instructions.DEC]
description = "Decrement"
pcode = """
$0 = $0 - 1
ZF = ($0 == 0)
SF = ($0 s< 0)
"""

[instructions.NEG]
description = "Two's complement negation"
pcode = "$0 = -$0"

# --- 乗算・除算 ---

[instructions.MUL]
description = "Unsigned multiply"
pcode = """
result = zext(RAX) * zext($0)
RAX = trunc64(result)
RDX = trunc64(result >> 64)
"""

[instructions.IMUL]
description = "Signed multiply"

[[instructions.IMUL.variants]]
operands = ["reg64"]
pcode = """
result = sext(RAX) s* sext($0)
RAX = trunc64(result)
RDX = trunc64(result >> 64)
CF = (sext(RAX) != result)
OF = CF
"""

[[instructions.IMUL.variants]]
operands = ["dest:reg64", "src:reg64"]
pcode = """
$0 = $0 s* $1
CF = overflow_signed($0, $1)
OF = CF
"""

[[instructions.IMUL.variants]]
operands = ["dest:reg64", "src:reg64", "imm"]
pcode = """
$0 = $1 s* $2
CF = overflow_signed($1, $2)
OF = CF
"""

[instructions.DIV]
description = "Unsigned divide"
pcode = """
dividend = (RDX << 64) | RAX
RAX = dividend / $0
RDX = dividend % $0
"""

[instructions.IDIV]
description = "Signed divide"
pcode = """
dividend = (RDX << 64) | RAX
RAX = dividend s/ $0
RDX = dividend s% $0
"""

# --- ビット演算 ---

[instructions.AND]
class = "binary_logic"
operator = "INT_AND"

[instructions.OR]
class = "binary_logic"
operator = "INT_OR"

[instructions.XOR]
class = "binary_logic"
operator = "INT_XOR"

[instructions.NOT]
description = "Bitwise NOT"
pcode = "$0 = ~$0"

# --- 比較・テスト ---

[instructions.CMP]
description = "Compare"
pcode = """
temp = $0 - $1
ZF = (temp == 0)
SF = (temp s< 0)
CF = borrow($0, $1)
OF = overflow_sub($0, $1)
"""

[instructions.TEST]
description = "Logical compare"
pcode = """
temp = $0 & $1
ZF = (temp == 0)
SF = (temp s< 0)
CF = 0
OF = 0
"""

# --- 制御フロー ---

[instructions.JMP]
description = "Unconditional jump"
pcode = "BRANCH $0"

[instructions.CALL]
description = "Call procedure"
pcode = "CALL $0"

[instructions.RET]
description = "Return from procedure"
pcode = "RETURN"

# --- 条件分岐（パターン定義） ---

[instruction_patterns.conditional_jump]
pattern = "J{cond}"
pcode = "CBRANCH {flag_expr}, $0"

[[instruction_patterns.conditional_jump.conditions]]
name = "E"
flag_expr = "ZF == 1"

[[instruction_patterns.conditional_jump.conditions]]
name = "NE"
flag_expr = "ZF == 0"

[[instruction_patterns.conditional_jump.conditions]]
name = "L"
flag_expr = "SF != OF"

[[instruction_patterns.conditional_jump.conditions]]
name = "LE"
flag_expr = "(SF != OF) | ZF"

[[instruction_patterns.conditional_jump.conditions]]
name = "G"
flag_expr = "(SF == OF) & !ZF"

[[instruction_patterns.conditional_jump.conditions]]
name = "GE"
flag_expr = "SF == OF"

[[instruction_patterns.conditional_jump.conditions]]
name = "B"
flag_expr = "CF == 1"

[[instruction_patterns.conditional_jump.conditions]]
name = "BE"
flag_expr = "CF | ZF"

[[instruction_patterns.conditional_jump.conditions]]
name = "A"
flag_expr = "!CF & !ZF"

[[instruction_patterns.conditional_jump.conditions]]
name = "AE"
flag_expr = "CF == 0"

[[instruction_patterns.conditional_jump.conditions]]
name = "S"
flag_expr = "SF == 1"

[[instruction_patterns.conditional_jump.conditions]]
name = "NS"
flag_expr = "SF == 0"

[[instruction_patterns.conditional_jump.conditions]]
name = "O"
flag_expr = "OF == 1"

[[instruction_patterns.conditional_jump.conditions]]
name = "NO"
flag_expr = "OF == 0"

# --- NOP ---

[instructions.NOP]
description = "No operation"
pcode = ""

# --- シフト命令 ---

[instructions.SHL]
description = "Shift left"
pcode = "$0 = $0 << $1"

[instructions.SHR]
description = "Shift right (logical)"
pcode = "$0 = $0 >> $1"

[instructions.SAR]
description = "Shift arithmetic right"
pcode = "$0 = $0 s>> $1"

[instructions.ROL]
description = "Rotate left"
pcode = "$0 = rotate_left($0, $1)"

[instructions.ROR]
description = "Rotate right"
pcode = "$0 = rotate_right($0, $1)"

# --- 文字列命令 ---

[instructions.MOVSB]
description = "Move string byte (RSI -> RDI)"
pcode = "MOVSB"

[instructions.MOVSW]
description = "Move string word (RSI -> RDI)"
pcode = "MOVSW"

[instructions.MOVSD]
description = "Move string dword (RSI -> RDI)"
pcode = "MOVSD"

[instructions.MOVSQ]
description = "Move string qword (RSI -> RDI)"
pcode = "MOVSQ"

[instructions.STOSB]
description = "Store AL to [RDI]"
pcode = "STOSB"

[instructions.STOSW]
description = "Store AX to [RDI]"
pcode = "STOSW"

[instructions.STOSD]
description = "Store EAX to [RDI]"
pcode = "STOSD"

[instructions.STOSQ]
description = "Store RAX to [RDI]"
pcode = "STOSQ"

[instructions.LODSB]
description = "Load byte from [RSI] to AL"
pcode = "LODSB"

[instructions.LODSW]
description = "Load word from [RSI] to AX"
pcode = "LODSW"

[instructions.LODSD]
description = "Load dword from [RSI] to EAX"
pcode = "LODSD"

[instructions.LODSQ]
description = "Load qword from [RSI] to RAX"
pcode = "LODSQ"

# --- 符号拡張 ---

[instructions.CDQ]
description = "Convert doubleword to quadword (EAX -> EDX:EAX)"
pcode = "CDQ"

[instructions.CQO]
description = "Convert quadword to octword (RAX -> RDX:RAX)"
pcode = "CQO"

[instructions.CBW]
description = "Convert byte to word (AL -> AX)"
pcode = "CBW"

[instructions.CWDE]
description = "Convert word to doubleword (AX -> EAX)"
pcode = "CWDE"

[instructions.CDQE]
description = "Convert doubleword to quadword (EAX -> RAX)"
pcode = "CDQE"

# --- SSE命令（SIMD浮動小数点） ---

[instructions.MOVAPS]
description = "Move aligned packed single-precision FP"
pcode = "$0 = $1"

[instructions.MOVUPS]
description = "Move unaligned packed single-precision FP"
pcode = "$0 = $1"

[instructions.MOVAPD]
description = "Move aligned packed double-precision FP"
pcode = "$0 = $1"

[instructions.MOVUPD]
description = "Move unaligned packed double-precision FP"
pcode = "$0 = $1"

[instructions.MOVSS]
description = "Move scalar single-precision FP"
pcode = "$0 = $1"

# Note: MOVSD (SSE) は文字列操作のMOVSDと名前が重複するため、
# Rustコード側で直接実装済み（x86_64.rs）
# [instructions.MOVSD]
# description = "Move scalar double-precision FP"
# pcode = "$0 = $1"

[instructions.XORPS]
description = "XOR packed single-precision FP"
pcode = "$0 = $0 ^ $1"

[instructions.XORPD]
description = "XOR packed double-precision FP"
pcode = "$0 = $0 ^ $1"

[instructions.ANDPS]
description = "AND packed single-precision FP"
pcode = "$0 = $0 & $1"

[instructions.ANDPD]
description = "AND packed double-precision FP"
pcode = "$0 = $0 & $1"

[instructions.ORPS]
description = "OR packed single-precision FP"
pcode = "$0 = $0 | $1"

[instructions.ORPD]
description = "OR packed double-precision FP"
pcode = "$0 = $0 | $1"

[instructions.ADDPS]
description = "Add packed single-precision FP"
pcode = "$0 = $0 + $1"

[instructions.ADDPD]
description = "Add packed double-precision FP"
pcode = "$0 = $0 + $1"

[instructions.SUBPS]
description = "Subtract packed single-precision FP"
pcode = "$0 = $0 - $1"

[instructions.SUBPD]
description = "Subtract packed double-precision FP"
pcode = "$0 = $0 - $1"

[instructions.MULPS]
description = "Multiply packed single-precision FP"
pcode = "$0 = $0 * $1"

[instructions.MULPD]
description = "Multiply packed double-precision FP"
pcode = "$0 = $0 * $1"

[instructions.DIVPS]
description = "Divide packed single-precision FP"
pcode = "$0 = $0 / $1"

[instructions.DIVPD]
description = "Divide packed double-precision FP"
pcode = "$0 = $0 / $1"

# --- CMOV系（条件付きMOV） ---

[instructions.CMOVE]
description = "Conditional move if equal (ZF=1)"
pcode = "CMOV_E $0, $1"

[instructions.CMOVNE]
description = "Conditional move if not equal (ZF=0)"
pcode = "CMOV_NE $0, $1"

[instructions.CMOVL]
description = "Conditional move if less (SF!=OF)"
pcode = "CMOV_L $0, $1"

[instructions.CMOVLE]
description = "Conditional move if less or equal"
pcode = "CMOV_LE $0, $1"

[instructions.CMOVG]
description = "Conditional move if greater"
pcode = "CMOV_G $0, $1"

[instructions.CMOVGE]
description = "Conditional move if greater or equal"
pcode = "CMOV_GE $0, $1"

[instructions.CMOVB]
description = "Conditional move if below (CF=1)"
pcode = "CMOV_B $0, $1"

[instructions.CMOVBE]
description = "Conditional move if below or equal"
pcode = "CMOV_BE $0, $1"

[instructions.CMOVA]
description = "Conditional move if above"
pcode = "CMOV_A $0, $1"

[instructions.CMOVAE]
description = "Conditional move if above or equal"
pcode = "CMOV_AE $0, $1"

[instructions.CMOVS]
description = "Conditional move if sign (SF=1)"
pcode = "CMOV_S $0, $1"

[instructions.CMOVNS]
description = "Conditional move if not sign (SF=0)"
pcode = "CMOV_NS $0, $1"

[instructions.CMOVO]
description = "Conditional move if overflow (OF=1)"
pcode = "CMOV_O $0, $1"

[instructions.CMOVNO]
description = "Conditional move if not overflow (OF=0)"
pcode = "CMOV_NO $0, $1"

[instructions.CMOVZ]
description = "Conditional move if zero (ZF=1, alias for CMOVE)"
pcode = "CMOV_E $0, $1"

[instructions.CMOVNZ]
description = "Conditional move if not zero (ZF=0, alias for CMOVNE)"
pcode = "CMOV_NE $0, $1"
